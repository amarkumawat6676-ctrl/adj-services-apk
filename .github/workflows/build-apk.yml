name: Build ADJ SERVICES APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Clean project
        run: ./gradlew clean --no-daemon

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Find generated APK
        run: |
          echo "Searching for generated APK..."
          find . -type f \
            -path "*/build/outputs/apk/release/*.apk" \
            -print

      - name: Rename APK
        run: |
          APK=$(find . -type f \
            -path "*/build/outputs/apk/release/*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK not found."
            exit 1
          fi

          cp "$APK" "ADJ-SERVICES.apk"

          echo "Final APK:"
          ls -lh ADJ-SERVICES.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ADJ-SERVICES-APK
          path: ADJ-SERVICES.apk
          if-no-files-found: error
          retention-days: 30
