name: Build ADJ SERVICES APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-release-apk:
    name: Build and Publish ADJ SERVICES APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Android Source ZIP
        id: find_zip
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' \
            -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No Android source ZIP found."
            exit 1
          fi

          echo "Using source ZIP: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract Android Project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf apk_project
          mkdir -p apk_project

          unzip -q "${{ steps.find_zip.outputs.zip_file }}" -d apk_project

          echo "Extracted project:"
          find apk_project -maxdepth 3 -type f | head -150

      - name: Locate Android Project Root
        id: project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "apk_project/settings.gradle" ]; then
            PROJECT_ROOT="apk_project"
          elif [ -f "apk_project/settings.gradle.kts" ]; then
            PROJECT_ROOT="apk_project"
          else
            PROJECT_ROOT=$(find apk_project -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -printf '%h\n' | head -1)
          fi

          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: Android project root not found."
            exit 1
          fi

          echo "Android project root: $PROJECT_ROOT"
          echo "project_root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"

      - name: Prepare Release Version
        working-directory: ${{ steps.project.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail

          test -f app/build.gradle || { echo "ERROR: app/build.gradle missing."; exit 1; }

          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle')
          s=p.read_text()
          import re
          s,n1=re.subn(r"versionName\s+['\"][^'\"]+['\"]", "versionName '15.9.10'", s, count=1)
          s,n2=re.subn(r"versionCode\s+\d+", "versionCode 37", s, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit(f"Could not update versionName/versionCode: {n1}/{n2}")
          p.write_text(s)
          print('Prepared versionName 15.9.10 / versionCode 37')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK path not found."
            exit 1
          fi

          echo "Android SDK: $SDK_ROOT"

          test -d "$SDK_ROOT/platforms/android-35" \
            || { echo "ERROR: Android 35 platform missing."; exit 1; }

          test -d "$SDK_ROOT/build-tools/35.0.0" \
            || { echo "ERROR: Build Tools 35.0.0 missing."; exit 1; }

          echo "Android SDK verification PASS."

      - name: Verify Firebase and Signing Files
        working-directory: ${{ steps.project.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail

          test -f app/google-services.json \
            || { echo "ERROR: app/google-services.json missing."; exit 1; }

          if [ -f "../adj-services-release.keystore" ]; then
            echo "Release keystore found."
          elif [ -f "adj-services-release.keystore" ]; then
            echo "Release keystore found."
          else
            echo "ERROR: Release keystore not found."
            exit 1
          fi

          echo "Firebase/signing verification PASS."

      - name: Read App Version
        id: version
        working-directory: ${{ steps.project.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION_NAME=$(grep -oE "versionName[[:space:]]+['\"][^'\"]+['\"]" app/build.gradle \
            | head -1 \
            | sed -E "s/.*['\"]([^'\"]+)['\"]/\1/")

          VERSION_CODE=$(grep -oE "versionCode[[:space:]]+[0-9]+" app/build.gradle \
            | head -1 \
            | awk '{print $2}')

          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "ERROR: Could not read app version."
            exit 1
          fi

          echo "Version Name: $VERSION_NAME"
          echo "Version Code: $VERSION_CODE"

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Build Release APK
        working-directory: ${{ steps.project.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail

          gradle --no-daemon \
            :app:assembleRelease \
            --stacktrace

      - name: Verify Generated APK
        id: apk
        working-directory: ${{ steps.project.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find app/build/outputs/apk/release \
            -type f -name '*.apk' | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          echo "Generated APK:"
          ls -lh "$APK"

          mkdir -p release
          cp "$APK" release/ADJ-SERVICES.apk

          test -s release/ADJ-SERVICES.apk \
            || { echo "ERROR: ADJ-SERVICES.apk is empty."; exit 1; }

          echo "apk_path=release/ADJ-SERVICES.apk" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: ADJ SERVICES v${{ steps.version.outputs.version_name }}
          generate_release_notes: false
          files: ${{ steps.project.outputs.project_root }}/${{ steps.apk.outputs.apk_path }}
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Summary
        shell: bash
        run: |
          echo "=========================================="
          echo "ADJ SERVICES APK BUILD SUCCESS"
          echo "Version: ${{ steps.version.outputs.version_name }}"
          echo "VersionCode: ${{ steps.version.outputs.version_code }}"
          echo "Release: v${{ steps.version.outputs.version_name }}"
          echo "Asset: ADJ-SERVICES.apk"
          echo "=========================================="
