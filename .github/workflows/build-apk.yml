name: Build ADJ SERVICES APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract V14 APK project
        shell: bash
        run: |
          set -e

          ZIP_FILE="./ADJ_SERVICES_V14_SUPER_FAST.zip"

          echo "Checking V14 ZIP..."
          ls -lh "$ZIP_FILE"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: V14 ZIP not found!"
            echo "Files in repository:"
            ls -lah
            exit 1
          fi

          echo "Using: $ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "V14 ZIP extracted successfully."

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find extracted -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found!"
            find extracted -maxdepth 5 -type f | head -100
            exit 1
          fi

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify V14 version
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "===== Checking V14 version ====="

          grep -n "versionCode" app/build.gradle || true
          grep -n "versionName" app/build.gradle || true

          echo "===== Checking MainActivity ====="
          grep -n "ADJServicesAPK" \
            app/src/main/java/in/adjservices/app/MainActivity.java || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10"

      - name: Build V14 Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "===== BUILDING ADJ SERVICES V14 ====="

          gradle :app:assembleDebug --no-daemon

          echo "===== V14 BUILD COMPLETE ====="

      - name: Verify generated APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "===== GENERATED APK ====="

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload V14 APK
        uses: actions/upload-artifact@v4
        with:
          name: ADJ-SERVICES-APK-V14
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
