name: Build ADJ SERVICES APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract V14.4 project ZIP
        run: |
          rm -rf apk_project
          mkdir apk_project
          unzip -q ADJ_SERVICES_V14_4_ONE_UPLOAD.zip -d apk_project
          test -f apk_project/settings.gradle
          test -f apk_project/build.gradle
          test -f apk_project/app/build.gradle
          echo "V14.4 project extracted successfully."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        run: |
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q /tmp/gradle.zip -d "$HOME"
          echo "$HOME/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: Build APK
        working-directory: apk_project
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Rename APK
        run: |
          cp apk_project/app/build/outputs/apk/debug/app-debug.apk ADJ-SERVICES.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ADJ-SERVICES-V14.4
          path: ADJ-SERVICES.apk
          if-no-files-found: error
