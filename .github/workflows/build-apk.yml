name: Build ADJ SERVICES APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        run: |
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q /tmp/gradle.zip -d "$HOME"
          echo "$HOME/gradle-8.10.2/bin" >> "$GITHUB_PATH"
          gradle --version

      - name: Verify V14.2 project
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/in/adjservices/app/MainActivity.java
          grep -q "versionName '14.2'" app/build.gradle
          grep -q "ADJServicesAPK/14.2" app/src/main/java/in/adjservices/app/MainActivity.java
          echo "V14.2 project files verified."

      - name: Build V14.2 Debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify generated APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload V14.2 APK
        uses: actions/upload-artifact@v4
        with:
          name: ADJ-SERVICES-V14.2-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
